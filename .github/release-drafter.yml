name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE by @$AUTHOR in #$NUMBER'
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'enhancement'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'dependencies'
  default: patch

categories:
  - title: '🚀 Features & Enhancements'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '🧹 Code Quality & Refactoring'
    labels:
      - 'refactor'
      - 'quality'
      - 'documentation'
  - title: '📦 Dependency Updates'
    labels:
      - 'dependencies'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/arkrix/vylop/commits/$RESOLVED_VERSION
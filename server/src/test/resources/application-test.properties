# --- Datasource Configuration (Force H2 In-Memory) ---
spring.datasource.url=jdbc:h2:mem:vylopdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Disable Flyway during tests ---
spring.flyway.enabled=false

# --- Dummy Mock Values for Testing (Safe to Commit) ---
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
jwt.expiration=86400000

spring.security.oauth2.client.registration.google.client-id=dummy-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
spring.application.name=Backend

# --- PostgreSQL Database Configuration ---
# Uses Render environment variables if available, otherwise defaults to local dev settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vylopdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway Configuration (Database Version Control) ---
# Automatically inherits datasource connection details above
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG

# --- Hibernate & JPA Settings ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Google OAuth2 Setup ---
# Includes dummy fallbacks so the application context starts even if .env variables are unset
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# --- Local Dotenv Import ---
spring.config.import=optional:file:.env[.properties]
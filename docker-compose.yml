services:
  postgres:
    image: postgres:16-alpine
    container_name: vylop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vylop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vylop"]
      interval: 5s
      timeout: 5s
      retries: 5

  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: vylop-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vylop-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      piston:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vylop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      PISTON_URL: http://piston:2000/api/v2

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vylop-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:8080"

volumes:
  postgres_data:
  piston_packages: